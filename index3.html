<html>
    <head>
        <style>
           
            #box1{
                height: 200px;
                width: 200px;
                border: 2px solid red;
               position: relative;
               top: 0;
               left: 0;

            }
            #box2{
                height: 200px;
                width: 200px;
                border: 2px solid aqua;
                position: relative;
                bottom: 0;
                left: 0;
            }
            #box3{
                 height: 200px; 
                 width: 200px;
                 border: 2px solid blue; 
                 position: relative;
                 top: 0;
                 right: 0;
                    }
            #box4{
                height: 200px;
                width: 200px;
                border: 2px solid rgb(217, 96, 9);
                position: relative;
                bottom: 0;
                right: 0;
            }        
                
            
             #container{
                height: 900px;
                width: 900px;
                border: 2px solid rgb(219, 8, 8);
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                align-items: start;
                
            }
           
        </style>
    </head>
    <body>
        <div id="container">
            <div id="box1"><h1>box1</h1></div>
            <div id="box2"><h1>box2</h1></div>
           <div id="box3"><h1>box3</h1></div>
            <div id="box4"><h1>box4</h1></div>
            
        </div>
        <div></div>
    </body>
</html>
